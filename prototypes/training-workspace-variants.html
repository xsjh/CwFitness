<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CwFitness · 训练工作台原型</title>
  <style>
    :root { color-scheme: dark; --lime:#c8eb7a; --ink:#090b0c; --panel:#121617; --line:rgba(255,255,255,.09); --muted:#89918d; --text:#f4f6f2; --red:#ff6978; }
    * { box-sizing:border-box } body { margin:0; min-width:320px; background:#060707; color:var(--text); font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer } .stage { min-height:100vh; } .app { min-height:100vh; display:grid; grid-template-columns:248px minmax(0,1fr); background:radial-gradient(circle at 80% 0%,rgba(200,235,122,.09),transparent 31%),var(--ink); }
    .sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:28px 14px 18px; border-right:1px solid var(--line); background:rgba(8,10,11,.76); backdrop-filter:blur(18px); }
    .brand { display:flex; align-items:center; gap:10px; padding:0 10px 32px; font-weight:800; font-size:17px; letter-spacing:-.04em; }.mark { width:27px; height:27px; border-radius:9px; background:conic-gradient(from 120deg,#e9f8bd,#a4d25a,#496a33,#e9f8bd); box-shadow:0 0 25px rgba(200,235,122,.27); }
    .side-label { margin:13px 10px 7px; color:#59615d; font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }.side-nav { display:grid; gap:4px; }.side-nav button { display:flex; align-items:center; gap:11px; width:100%; padding:10px; border:0; border-radius:10px; background:transparent; color:#99a19d; text-align:left; transition:background-color .16s ease-out,color .16s ease-out,transform .16s ease-out; }.side-nav button:hover { color:#fff; background:rgba(255,255,255,.05); }.side-nav button[aria-current="page"] { color:#15200e; background:var(--lime); box-shadow:0 10px 24px rgba(166,208,88,.15); }.nav-icon { width:17px; text-align:center; font-size:16px; }.user { display:flex; align-items:center; gap:10px; margin-top:auto; padding:10px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.025); }.avatar { display:grid; width:35px; height:35px; place-items:center; border-radius:12px; color:#182010; background:linear-gradient(145deg,#effab7,#7ea84c); font-weight:850; }.user strong,.user small { display:block; }.user small { color:var(--muted); font-size:11px; }.user button { margin-left:auto; border:0; background:transparent; color:#89918d; font-size:17px; }
    .main { min-width:0; padding:28px clamp(20px,4vw,60px) 82px; }.topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:31px; }.eyebrow { margin:0 0 3px; color:var(--lime); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }.topbar h1 { margin:0; font-size:clamp(28px,3vw,40px); letter-spacing:-.055em; }.top-actions { display:flex; align-items:center; gap:10px; }.quiet-button,.icon-button { border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.035); color:#c7cdca; }.quiet-button { padding:10px 13px; }.icon-button { width:38px; height:38px; font-size:17px; }.primary { padding:11px 16px; border:0; border-radius:10px; background:var(--lime); color:#18200f; font-weight:800; box-shadow:0 10px 24px rgba(180,221,99,.16); }.primary:active,.quiet-button:active,.side-nav button:active { transform:scale(.97); }
    .grid { display:grid; gap:16px; }.card { border:1px solid var(--line); border-radius:18px; background:linear-gradient(140deg,rgba(255,255,255,.06),rgba(255,255,255,.02)); box-shadow:inset 0 1px rgba(255,255,255,.05); }.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }.card h2,.card h3 { margin:0; letter-spacing:-.04em; }.card p { color:var(--muted); }.stat { color:var(--muted); font-size:12px; }.stat strong { display:block; margin-top:3px; color:var(--text); font-size:25px; letter-spacing:-.05em; }.progress { height:8px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.08); }.progress i { display:block; width:65%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#86b74b,var(--lime)); }.day-dots { display:flex; gap:7px; }.day-dots span { width:8px; height:8px; border-radius:50%; background:#29302e; }.day-dots span.done { background:var(--lime); box-shadow:0 0 12px rgba(200,235,122,.7); }
    /* Focus direction */ .focus .hero { position:relative; overflow:hidden; min-height:340px; padding:30px; background:linear-gradient(125deg,#26351f 0%,#121714 45%,#111415 100%); }.focus .hero::after { position:absolute; right:-11%; bottom:-59%; width:500px; height:500px; border:1px solid rgba(200,235,122,.18); border-radius:50%; box-shadow:0 0 0 56px rgba(200,235,122,.025),0 0 0 112px rgba(200,235,122,.02); content:""; }.focus .hero>* { position:relative; z-index:1; }.focus .hero h2 { max-width:520px; margin:20px 0 12px; font-size:clamp(35px,4.5vw,63px); line-height:.94; }.focus .hero p { max-width:410px; }.focus .hero-footer { display:flex; align-items:center; gap:17px; margin-top:36px; }.focus .overview { grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr); margin-top:16px; }.focus .next { padding:23px; }.focus .next ul { display:grid; gap:13px; padding:0; margin:21px 0 0; list-style:none; }.focus .next li { display:flex; align-items:center; gap:12px; }.exercise-icon { display:grid; flex:0 0 36px; width:36px; height:36px; place-items:center; border-radius:11px; background:#202725; }.focus .next li span:last-child { margin-left:auto; color:var(--muted); font-size:12px; }.focus .week { display:grid; grid-template-columns:repeat(7,1fr); gap:9px; padding:23px; }.focus .week div { display:grid; gap:8px; text-align:center; color:var(--muted); font-size:11px; }.focus .week b { display:grid; height:70px; place-items:end center; border-radius:11px; background:rgba(255,255,255,.04); }.focus .week i { display:block; width:8px; border-radius:99px 99px 4px 4px; background:#49534d; }.focus .week .today b { background:rgba(200,235,122,.13); }.focus .week .today i { height:51px!important; background:var(--lime); }
    /* Command direction */ .command .command-grid { grid-template-columns:minmax(0,1fr) 330px; }.command .metric-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }.command .metric { padding:18px; }.command .metric span { color:var(--muted); font-size:12px; }.command .metric strong { display:block; margin-top:6px; font-size:27px; letter-spacing:-.06em; }.command .workout-card { margin-top:16px; padding:24px; }.command .sets { display:grid; gap:1px; overflow:hidden; margin-top:19px; border-radius:13px; background:var(--line); }.command .set { display:grid; grid-template-columns:1.5fr repeat(3,.7fr) 90px; align-items:center; gap:12px; min-height:58px; padding:10px 13px; background:#101415; }.command .set span { color:var(--muted); font-size:12px; }.command .set strong { font-size:13px; }.record { padding:8px 10px; border:1px solid rgba(200,235,122,.35); border-radius:8px; color:var(--lime); background:rgba(200,235,122,.08); font-size:12px; font-weight:750; }.record.done { border-color:transparent; color:#15200e; background:var(--lime); }.command .rail { display:grid; gap:16px; }.command .rail .card { padding:21px; }.ring { display:grid; width:146px; height:146px; place-items:center; margin:20px auto 4px; border-radius:50%; background:radial-gradient(closest-side,#121617 76%,transparent 77% 100%),conic-gradient(var(--lime) 0 234deg,rgba(255,255,255,.08) 234deg); }.ring strong { font-size:25px; }.activity { display:grid; gap:13px; margin-top:20px; }.activity li { display:flex; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line); color:var(--muted); list-style:none; font-size:12px; }.activity b { color:var(--text); }
    /* Coach direction */ .coach .coach-grid { grid-template-columns:minmax(280px,.65fr) minmax(390px,1.35fr); }.coach .coach-panel { min-height:536px; padding:27px; background:linear-gradient(160deg,#202a20,#121615 52%,#0d1011); }.coach .coach-panel h2 { margin-top:32px; font-size:33px; line-height:1.03; }.coach .coach-panel .quote { margin-top:44px; padding-top:17px; border-top:1px solid rgba(255,255,255,.13); color:#dce4d4; line-height:1.7; }.coach .goal { display:flex; justify-content:space-between; align-items:end; margin-top:28px; }.coach .goal strong { font-size:31px; letter-spacing:-.06em; }.coach .schedule { padding:26px; }.coach .schedule-list { display:grid; gap:10px; margin-top:22px; }.schedule-item { display:grid; grid-template-columns:40px 1fr auto; gap:13px; align-items:center; padding:13px; border:1px solid transparent; border-radius:13px; }.schedule-item.active { border-color:rgba(200,235,122,.38); background:rgba(200,235,122,.09); }.schedule-item time { color:var(--muted); font-size:12px; }.schedule-item strong,.schedule-item span { display:block; }.schedule-item span { margin-top:2px; color:var(--muted); font-size:12px; }.coach .chart { padding:26px; margin-top:16px; }.bars { display:flex; align-items:end; justify-content:space-between; height:154px; gap:13px; margin-top:30px; padding:0 3px; border-bottom:1px solid var(--line); }.bars div { display:grid; flex:1; align-items:end; height:100%; }.bars i { display:block; min-height:16px; border-radius:7px 7px 2px 2px; background:#3d4841; }.bars div:nth-child(6) i { background:var(--lime); box-shadow:0 0 18px rgba(200,235,122,.32); }.chart-labels { display:flex; justify-content:space-between; margin-top:8px; color:var(--muted); font-size:11px; }
    .subpage { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }.subpage .card { min-height:210px; padding:23px; }.subpage h2 { grid-column:1/-1; margin:0 0 -4px; font-size:23px; }.empty-copy { margin-top:18px; color:var(--muted); }.toast { position:fixed; right:25px; bottom:25px; z-index:50; padding:11px 14px; border:1px solid rgba(200,235,122,.3); border-radius:11px; color:#ecf6dc; background:#1a2416; box-shadow:0 14px 40px rgba(0,0,0,.35); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s ease-out,transform .2s ease-out; }.toast.show { opacity:1; transform:none; }
    .proto-picker { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2147483647; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,10,10,.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }.proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12); will-change:transform; }.proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1); } @media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}} .proto-picker-item { position:relative; display:flex; align-items:center; height:28px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.55); font:inherit; cursor:pointer; transition:color 150ms ease-out; }.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    @media(max-width:900px){.app{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:21px 10px}.brand{justify-content:center;padding:0 0 28px}.brand b,.side-label,.side-nav button span:last-child,.user-copy,.user button{display:none}.side-nav button{justify-content:center;padding:11px}.nav-icon{width:auto}.user{justify-content:center;padding:7px}.command .command-grid,.coach .coach-grid,.focus .overview{grid-template-columns:1fr}.command .rail{grid-template-columns:repeat(2,1fr)}.subpage{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.app{display:block}.sidebar{position:fixed; z-index:30; top:auto; bottom:0; width:100%; height:auto; padding:7px 8px; border-top:1px solid var(--line); border-right:0; flex-direction:row; align-items:center; background:rgba(8,10,11,.94)}.brand,.side-label,.user{display:none}.side-nav{display:flex; width:100%; justify-content:space-around}.side-nav button{width:auto; padding:9px 10px}.main{padding:23px 16px 96px}.topbar{margin-bottom:22px}.top-actions .quiet-button{display:none}.focus .hero{min-height:380px;padding:24px}.command .metric-row{grid-template-columns:1fr 1fr}.command .set{grid-template-columns:1fr auto}.command .set span:nth-of-type(n+2){display:none}.command .rail{grid-template-columns:1fr}.coach .coach-panel{min-height:auto}.subpage{grid-template-columns:1fr}.proto-picker{bottom:72px}.proto-picker-item{padding:0 9px}}
  </style>
</head>
<body>
  <div id="stage" class="stage"></div><div class="toast" role="status" aria-live="polite"></div>
  <nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">专注训练</button><button class="proto-picker-item">数据控制台</button><button class="proto-picker-item">教练视角</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
  <script>
    const nav = [['today','⌂','今日'],['plans','▦','计划'],['exercises','◈','动作'],['history','◷','历史'],['progress','↗','进展']];
    const sidebar = () => `<aside class="sidebar"><div class="brand"><i class="mark"></i><b>CwFitness</b></div><p class="side-label">训练空间</p><nav class="side-nav">${nav.map(([id,icon,label])=>`<button data-view="${id}" ${id==='today'?'aria-current="page"':''}><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join('')}</nav><p class="side-label">账户</p><nav class="side-nav"><button data-action="settings"><span class="nav-icon">⚙</span><span>偏好设置</span></button></nav><div class="user"><span class="avatar">C</span><span class="user-copy"><strong>Chen Wei</strong><small>chenwei@cw.fit</small></span><button data-action="menu" aria-label="打开用户菜单">⋯</button></div></aside>`;
    const topbar = (eyebrow,title,button='开始训练') => `<header class="topbar"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1></div><div class="top-actions"><button class="quiet-button" data-action="search">⌕ 搜索训练记录</button><button class="icon-button" data-action="notify" aria-label="通知">◌</button><button class="primary" data-action="start">${button}</button></div></header>`;
    const focus = () => `<div class="app focus">${sidebar()}<main class="main">${topbar('星期二 · 9月16日','今天，为自己留出一小时。')}<section class="hero card"><p class="eyebrow">上肢力量 · 第 3 周</p><h2>胸、肩与三头<br>正在等你开始。</h2><p>4 个动作 · 12 组 · 预计 52 分钟。上次训练完成度 94%。</p><div class="hero-footer"><button class="primary" data-action="start">开始本次训练</button><span class="stat">今日已训练 <strong>0 分钟</strong></span></div></section><div class="grid overview"><article class="card next"><div class="card-head"><div><p class="eyebrow">训练清单</p><h2>接下来</h2></div><span class="stat">0 / 12 组</span></div><ul><li><span class="exercise-icon">⌁</span><span><strong>杠铃卧推</strong><small> 4 组 · 8 次 · 60 kg</small></span><span>未开始</span></li><li><span class="exercise-icon">△</span><span><strong>坐姿推肩</strong><small> 3 组 · 10 次 · 18 kg</small></span><span>未开始</span></li><li><span class="exercise-icon">↔</span><span><strong>绳索下压</strong><small> 3 组 · 12 次</small></span><span>未开始</span></li></ul></article><article class="card week"><div><span>一</span><b><i style="height:28px"></i></b></div><div><span>二</span><b><i style="height:0"></i></b></div><div class="today"><span>三</span><b><i></i></b></div><div><span>四</span><b><i style="height:36px"></i></b></div><div><span>五</span><b><i style="height:22px"></i></b></div><div><span>六</span><b><i style="height:45px"></i></b></div><div><span>日</span><b><i style="height:0"></i></b></div></article></div></main></div>`;
    const command = () => `<div class="app command">${sidebar()}<main class="main">${topbar('训练概览','本周训练控制台','继续训练')}<div class="command-grid grid"><div><section class="metric-row"><article class="card metric"><span>本周训练</span><strong>3<span> / 4</span></strong><div class="progress"><i style="width:75%"></i></div></article><article class="card metric"><span>训练时长</span><strong>2h 34m</strong><small>较上周 +18%</small></article><article class="card metric"><span>完成组数</span><strong>36</strong><small>目标 48 组</small></article><article class="card metric"><span>连续训练</span><strong>8 天</strong><small>个人最佳 14 天</small></article></section><section class="card workout-card"><div class="card-head"><div><p class="eyebrow">活动训练</p><h2>上肢力量 · 进行中</h2><p>已完成 7 / 12 组 · 32 分钟</p></div><button class="primary" data-action="start">进入训练</button></div><div class="sets"><div class="set"><strong>杠铃卧推</strong><span>第 3 组</span><span>8 次</span><span>60 kg</span><button class="record done" data-action="record">已记录 ✓</button></div><div class="set"><strong>杠铃卧推</strong><span>第 4 组</span><span>8 次</span><span>60 kg</span><button class="record" data-action="record">记录完成</button></div><div class="set"><strong>坐姿推肩</strong><span>第 1 组</span><span>10 次</span><span>18 kg</span><button class="record" data-action="record">记录完成</button></div><div class="set"><strong>坐姿推肩</strong><span>第 2 组</span><span>10 次</span><span>18 kg</span><button class="record" data-action="record">记录完成</button></div></div></section></div><aside class="rail"><article class="card"><div class="card-head"><h3>本周完成度</h3><span class="stat">第 3 周</span></div><div class="ring"><strong>65%</strong></div><p style="text-align:center">再完成 12 组，即可达成本周计划。</p></article><article class="card"><div class="card-head"><h3>最近活动</h3><button class="quiet-button" data-view="history">查看全部</button></div><ul class="activity"><li><span><b>下肢力量</b><br>昨日 · 46 分钟</span><strong>92%</strong></li><li><span><b>拉力训练</b><br>9月13日 · 51 分钟</span><strong>100%</strong></li><li><span><b>核心激活</b><br>9月11日 · 24 分钟</span><strong>88%</strong></li></ul></article></aside></div></main></div>`;
    const coach = () => `<div class="app coach">${sidebar()}<main class="main">${topbar('你的训练节奏','稳定地变强。','开始今日训练')}<div class="coach-grid grid"><aside class="card coach-panel"><p class="eyebrow">本周反馈</p><h2>你已经比上周多完成了 4 组。</h2><p>规律比爆发更珍贵。今天的上肢训练会让你的推举计划保持在正轨。</p><div class="goal"><div><span class="stat">本周目标</span><strong>3 / 4</strong></div><div class="day-dots"><span class="done"></span><span class="done"></span><span class="done"></span><span></span></div></div><div class="quote">“训练不必完美；只要下一组比上一组更专注。”</div></aside><div><section class="card schedule"><div class="card-head"><div><p class="eyebrow">训练安排</p><h2>今天与接下来</h2></div><button class="quiet-button" data-view="plans">编辑计划</button></div><div class="schedule-list"><div class="schedule-item active"><time>今天<br>18:30</time><div><strong>上肢力量</strong><span>胸、肩、三头 · 4 动作</span></div><button class="primary" data-action="start">开始</button></div><div class="schedule-item"><time>周四<br>18:30</time><div><strong>下肢力量</strong><span>深蹲、硬拉、腿推</span></div><span class="stat">45 分钟</span></div><div class="schedule-item"><time>周六<br>10:00</time><div><strong>拉力训练</strong><span>背部、二头、核心</span></div><span class="stat">50 分钟</span></div></div></section><section class="card chart"><div class="card-head"><div><p class="eyebrow">训练时间</p><h2>最近七天</h2></div><strong style="color:var(--lime)">2h 34m</strong></div><div class="bars">${[38,66,20,74,43,98,31].map(h=>`<div><i style="height:${h}%"></i></div>`).join('')}</div><div class="chart-labels"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div></section></div></div></main></div>`;
    const content = {plans:['训练计划','上肢力量、下肢力量与拉力训练均可在此编排。','3 个进行中的计划'],exercises:['动作库','创建、命名或整理你的动作；每个动作会保留自己的记录方式。','28 个动作'],history:['训练历史','回看已完成的训练并修正每一组的历史记录。','本月 11 次训练'],progress:['训练进展','查看四周日历、每周训练时间、动作趋势与计划完成概览。','连续训练 8 天']};
    const subpage = id => { const [title,copy,stat] = content[id]; return `<div class="app">${sidebar()}<main class="main">${topbar('训练空间',title,'新增') }<section class="subpage"><h2>${title}</h2>${['本周摘要','最近记录','下一步'].map((h,i)=>`<article class="card"><p class="eyebrow">${i===0?stat:'CwFitness'}</p><h3>${h}</h3><p class="empty-copy">${i===0?copy:'这里将保留现有功能和数据，只以新的深色左侧导航方式呈现。'}</p><button class="quiet-button" data-action="show">查看详情</button></article>`).join('')}</section></main></div>`; };
    const variants=[focus,command,coach], stage=document.getElementById('stage'), picker=document.querySelector('.proto-picker'), highlight=picker.querySelector('.proto-picker-highlight'), items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')], replay=picker.querySelector('.proto-picker-replay'); let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`} function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bindStage()})} function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    function toast(message){const el=document.querySelector('.toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2200)} function bindStage(){stage.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.view;if(id==='today')mount(current);else {stage.innerHTML=subpage(id);bindStage()} }));stage.querySelectorAll('[data-action="start"]').forEach(el=>el.addEventListener('click',()=>toast('训练已开始 · 可继续记录每一组')));stage.querySelectorAll('[data-action="record"]').forEach(el=>el.addEventListener('click',()=>{el.classList.add('done');el.textContent='已记录 ✓';toast('第 4 组已记录')}));stage.querySelectorAll('[data-action]').forEach(el=>{if(!['start','record'].includes(el.dataset.action))el.addEventListener('click',()=>toast(el.dataset.action==='settings'?'偏好设置将在账户菜单中打开':'这是原型中的交互预览'))})}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
